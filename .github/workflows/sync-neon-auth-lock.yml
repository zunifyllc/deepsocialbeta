# Temporary branch-only migration helper. Remove after bun.lock is committed.
name: Sync Neon Auth dependency lockfile
on:
  push:
    branches:
      - feat/neon-managed-auth
    paths:
      - package.json
      - .github/workflows/sync-neon-auth-lock.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'zunifyllc/deepsocialbeta'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Re-resolve Bun lock without running install scripts
        run: bun install --lockfile-only --ignore-scripts
      - name: Commit lockfile to feature branch
        run: |
          git add bun.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: lock Neon Managed Auth SDK dependencies"
            git push origin HEAD:feat/neon-managed-auth
          fi
