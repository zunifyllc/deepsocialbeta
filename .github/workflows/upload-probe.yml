name: One-time UploadThing signed upload probe
on:
  push:
    branches: [test/deepsocial-preview-e2e]
    paths: [.github/workflows/upload-probe.yml]
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Signup and UploadThing presign+upload on isolated Preview
        env:
          TARGET_ORIGIN: https://deepsocialbeta-git-feat-uploadthing-media-zunifyllc.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import assert from 'node:assert/strict';

          const base = process.env.TARGET_ORIGIN;
          const email = `e2e-${process.env.GITHUB_RUN_ID}-${randomBytes(6).toString('hex')}@example.com`;
          const password = `T9!${randomBytes(26).toString('base64url')}`;
          const cookies = new Map();
          async function request(path, method = 'GET', payload = undefined) {
            const cookie = [...cookies].map(([k,v]) => `${k}=${v}`).join('; ');
            const response = await fetch(base + path, {
              method, redirect: 'manual',
              headers: {
                origin: base, referer: base + '/auth',
                ...(cookie ? { cookie } : {}),
                ...(payload === undefined ? {} : { 'content-type': 'application/json' })
              },
              ...(payload === undefined ? {} : {body: JSON.stringify(payload)}),
            });
            for(const setCookie of response.headers.getSetCookie()) {
              const pair = setCookie.split(';', 1)[0];
              const eq = pair.indexOf('=');
              if(eq < 0) continue;
              const name = pair.slice(0,eq), val = pair.slice(eq+1);
              if(/max-age=0/i.test(setCookie)) cookies.delete(name);
              else cookies.set(name,val);
            }
            return response;
          }
          async function responseBody(res) {
            const text = await res.text();
            try { return JSON.parse(text); } catch { return null; }
          }
          function mustEqual(actual, expected, at) {
            if (actual !== expected) throw new Error(`${at}: expected HTTP ${expected}, got ${actual}`);
          }
          console.log('Target: isolated Vercel Preview only');
          let res = await request('/api/auth/ok');
          mustEqual(res.status, 200, 'Neon health');
          res = await request('/api/session-check');
          mustEqual(res.status, 401, 'signed-out access');
          console.log('PASS anonymous protected access denied');

          res = await request('/api/auth/sign-up/email', 'POST', { name: 'Preview QA', email, password });
          if(res.status !== 200) {
            const body = await responseBody(res);
            console.log('Signup API status:', res.status, 'error code:', body?.code || body?.error?.code || body?.message?.slice(0,70) || '[no JSON]');
            throw new Error('Signup did not succeed');
          }
          console.log('PASS real managed Neon email sign-up');

          async function verifySession(stage) {
            const res = await request('/api/auth/get-session');
            mustEqual(res.status, 200, stage + ' session API');
            const session = await responseBody(res);
            assert.match(session?.user?.id??'', /^[0-9a-f]{8}-[0-9a-f-]{27,}$/i, stage + ' user UUID');
            const guarded = await request('/api/session-check');
            if(guarded.status !== 200) {
              const body = await responseBody(guarded);
              console.log('Guard status:', guarded.status, 'error:', body?.error?.message || body?.error || '[no JSON]');
              throw new Error(stage + ' protected route could not validate Neon session/profile');
            }
            const check = await responseBody(guarded);
            assert.equal(check?.authenticated, true);
            console.log('PASS', stage, 'session and Neon profile guard');
          }
          await verifySession('signup');

          // Use UploadThing's own v7 SDK to test the real presign and ingest path.
          const savedFetch = globalThis.fetch;
          globalThis.fetch = (input, init = {}) => {
            const url = typeof input === 'string' ? input : input instanceof URL ? input.href : input.url;
            if(url.startsWith(base + '/api/uploadthing')) {
              const headers = new Headers(init.headers ?? (input instanceof Request ? input.headers : undefined));
              headers.set('cookie',[...cookies].map(([k,v]) => `${k}=${v}`).join('; '));
              headers.set('origin',base);
              headers.set('referer',base+'/home');
              return savedFetch(input, {...init, headers});
            }
            return savedFetch(input,init);
          };
          const { genUploader } = await import('uploadthing/client');
          const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y/tLJYAAAAASUVORK5CYII=', 'base64');
          const file = new File([png], 'deepsocial-preview.png', {type:'image/png'});
          console.log('Attempting real UploadThing presign + image transfer');
          try {
            const { uploadFiles } = genUploader({url:base+'/api/uploadthing'});
            const uploaded = await uploadFiles('postImage',{files:[file]});
            assert.match(uploaded[0]?.url??'', /^https:\/\//, 'UploadThing CDN URL');
            console.log('PASS signed UploadThing file transferred');
          } catch(error) {
            // Do not leak tokens, passwords, response URLs, or cookie values.
            const msg = String(error instanceof Error ? error.message : error)
              .replace(/(?:sk_|eyJ)[A-Za-z0-9._=-]+/g,'[REDACTED]').slice(0,400);
            console.log('UPLOADTHING_DIAG:',error?.name??'Error',msg);
            throw new Error('UploadThing file upload did not complete');
          }


          res = await request('/api/auth/sign-out','POST',{});
          mustEqual(res.status, 200,'signout');
          res = await request('/api/auth/get-session');
          mustEqual(res.status,200,'signed-out session API');
          assert.equal(await responseBody(res),null,'session not cleared');
          console.log('PASS signout clears session');

          res = await request('/api/auth/sign-in/email','POST',{email,password});
          if(res.status !== 200) {
            const body = await responseBody(res);
            console.log('Sign-in status:',res.status,'error:',body?.code||body?.message||'[no JSON]');
            throw new Error('Sign-in did not succeed');
          }
          await verifySession('sign-in');
          const page = await request('/home');
          console.log('Signed-in home status:', page.status);
          console.log('PASS Neon Auth round trip');
          NODE
