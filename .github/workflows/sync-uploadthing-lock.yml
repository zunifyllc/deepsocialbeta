# Temporary dependency lockfile update for the isolated UploadThing branch.
name: Sync UploadThing dependency lockfile
on:
  push:
    branches: [feat/uploadthing-media]
    paths:
      - package.json
      - .github/workflows/sync-uploadthing-lock.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'zunifyllc/deepsocialbeta'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --lockfile-only --ignore-scripts
      - name: Commit maintained lockfile to feature branch
        run: |
          git add bun.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: lock UploadThing dependencies"
            git push origin HEAD:feat/uploadthing-media
          fi
