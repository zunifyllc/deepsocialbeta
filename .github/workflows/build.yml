name: DeepSocial build checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Environment files must not be tracked. Untrack these paths and rotate any exposed secrets."
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # package-lock.json predates the current package.json and cannot pass npm ci.
      # bun.lock matches package.json and is DeepSocial's maintained lockfile.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TanStack Router generates the route tree during Vite build.
      # A first-run typecheck can otherwise flag newly added routes as missing.
      - name: Production build (Vercel preset)
        run: NITRO_PRESET=vercel bun run build

      - name: Typecheck
        run: bunx tsc --noEmit
