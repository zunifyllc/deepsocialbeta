name: DeepSocial build checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # package-lock.json predates the current package.json and cannot pass npm ci.
      # bun.lock matches package.json and is DeepSocial's maintained lockfile.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Inspect Vercel auth bundle (diagnostic only)
        env:
          VERCEL: '1'
          NITRO_PRESET: vercel
        run: |
          bun run build
          echo "Inspecting Vercel auth bundle around reported runtime error"
          find .vercel/output -type f -name 'auth.server-*.mjs' | head -5
          find .vercel/output -type f -name 'auth.server-*.mjs' -print0 | while IFS= read -r -d '' f; do
            printf 'FILE=%s\\n' "$f"
            sed -n '425,445p' "$f" | cut -c 1-300
          done
