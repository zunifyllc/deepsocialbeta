name: Neon Auth Preview signup and session E2E

on:
  push:
    branches: [feat/neon-managed-auth]
    paths: [.github/workflows/preview-auth-e2e.yml]

permissions:
  contents: read

jobs:
  auth-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Exercise Preview-only signup, session and login
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import assert from 'node:assert/strict';

          const base = 'https://deepsocialbeta-le8d558h9-zunifyllc.vercel.app';
          assert.equal(base, "https://deepsocialbeta-le8d558h9-zunifyllc.vercel.app");
          const email = `deepsocial-ci-${process.env.GITHUB_RUN_ID}-${randomBytes(4).toString('hex')}@example.com`;
          const password = `Qa9!${randomBytes(24).toString('base64url')}`;
          const cookies = new Map();

          const send = async (path, options = {}) => {
            const header = [...cookies].map(([k, v]) => `${k}=${v}`).join('; ');
            const res = await fetch(base + path, {
              redirect: 'manual',
              ...options,
              headers: {
                origin: base,
                referer: base + '/auth',
                ...(header ? { cookie: header } : {}),
                ...(options.headers ?? {}),
              },
            });
            for (const part of res.headers.getSetCookie()) {
              const [pair] = part.split(';', 1);
              const eq = pair.indexOf('=');
              if (eq < 0) continue;
              const name = pair.slice(0, eq);
              const value = pair.slice(eq + 1);
              if (/max-age=0/i.test(part)) cookies.delete(name);
              else cookies.set(name, value);
            }
            return res;
          };

          const jsonPost = (path, body) =>
            send(path, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body),
            });

          async function assertSession(phase) {
            const res = await send('/api/auth/get-session');
            assert.equal(res.status, 200, `${phase}: get-session HTTP ${res.status}`);
            const data = await res.json();
            assert.match(data?.user?.id ?? '', /^[0-9a-f-]{36}$/i, `${phase}: invalid session id`);
            const protectedRes = await send('/api/session-check');
            assert.equal(protectedRes.status, 200, `${phase}: protected endpoint HTTP ${protectedRes.status}`);
            assert.equal((await protectedRes.json()).authenticated, true);
            console.log(`${phase}: valid Neon session and protected profile provisioning`);
          }

          const ping = await send('/api/auth/ok');
          assert.equal(ping.status, 200, 'Preview auth health failed');

          // A reserved example.com address avoids mail delivery to a real person.
          // Email verification is disabled on this isolated Neon Preview branch.
          const signup = await jsonPost('/api/auth/sign-up/email', {
            email,
            password,
            name: 'DeepSocial CI',
          });
          assert.equal(signup.status, 200, `signup: HTTP ${signup.status}`);
          console.log('signup: HTTP 200');
          await assertSession('signup');

          const out = await jsonPost('/api/auth/sign-out', {});
          assert.equal(out.status, 200, `signout: HTTP ${out.status}`);
          const signedOut = await send('/api/auth/get-session');
          assert.equal(signedOut.status, 200, 'signed-out session response failed');
          assert.equal(await signedOut.json(), null, 'session should be null after signout');
          console.log('signout: session cleared');

          const login = await jsonPost('/api/auth/sign-in/email', { email, password });
          assert.equal(login.status, 200, `login: HTTP ${login.status}`);
          await assertSession('login');
          console.log('PASS: real Preview signup, signout, login and guarded route');
          NODE
